services:
  db:
    image: postgis/postgis:16-3.4
    container_name: terrascale-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: terrascale
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - terrascale_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d terrascale"]
      interval: 5s
      timeout: 5s
      retries: 5

  martin:
    image: ghcr.io/maplibre/martin:latest
    container_name: terrascale-martin
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/terrascale
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  terrascale_data:
